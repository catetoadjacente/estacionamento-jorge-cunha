<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        
        .controls {
  padding-top: 1rem;
  display: grid;
  grid-template-rows: repeat(3, 1fr);
  grid-template-columns: 1fr 2fr;
  gap: 0.7rem;
}

label {
  font-size: 0.8rem;
  justify-self: end;
}

input[type="reset"],
input[type="submit"] {
  width: 5rem;
  justify-self: end;
}

input[type="reset"] {
  grid-column: 2;
  grid-row: 2;
}

input[type="submit"] {
  grid-column: 2;
  grid-row: 3;
}

.sidebar {
  width: 200px;
    background-color: #f0f0f0;
}
        
        
    </style>
</head>
<body>
    <h1 style="color:#2455df">cadastro rapido</h1>
    
    <div class="container">
  <aside class="sidebar">
    
    <ul>
      <li>dashboard</li>
      <li>consulta de usuario</li>
      <li>registro de entrada/saida</li>
      <li>historico</li>
      <li>alertas</li>
    </ul>
  </aside>
  
  
</div>

    
    <form>
        <fieldset>
            <legend>Informações pessoais</legend>
        <label for="nome Completo">Nome completo</label>
        <input type="text" id="nome Completo" placeholder="EX: Joao da Silva" required size="30" maxlength="50">
        <label for "telefone">Telefone</label> 
        <input type="text" id="telefone" placeholder="EX: (11) 99999999" required size="30" maxlength="11">
        <label for="cpf">CPF</label>
        <hr/>
        <input type="text" id="cpf" placeholder="EX: 00000000000" required size="30" maxlength="14">
        <label for="placa">Placa do carro</label>
        <input type="text" id="placa" placeholder="EX: ABC1234" required size="30" maxlength="7">
        <label for="marca">Marca do carro</label>
        <select name="marca" id="carros">
            <option value=ford>Ford</option>
        </select>

        <div class="controls">
    <label for="id">User ID:</label>
    <input type="text" id="id" name="id" />

    <input type="reset" value="Limopar campos" size = ""/>
    <input type="submit" value="Cadastrar visitantes" />
  </div>
        
    </form>
    
</body>
</html>
